[package]
name = "enyo"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "The Cyber Swiss Army Knife for terminal"
default-run = "enyo"
build = "crates/enyo/build.rs"

[lib]
path = "crates/enyo/src/lib.rs"

[[bin]]
name = "enyo"
path = "crates/enyo/src/main.rs"

[workspace]
members = [
    "crates/core",
    "crates/*",
]
default-members = ["."]
exclude = ["crates/enyo"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["Mozhu <mozhu233@outlook.com>"]

[workspace.dependencies]
enyo-core = { path = "crates/core" }
enyo-cmd-agentx = { path = "crates/agentx" }
enyo-cmd-basex = { path = "crates/basex" }
enyo-cmd-basic = { path = "crates/basic" }
enyo-cmd-encrypt = { path = "crates/encrypt" }
enyo-cmd-fastcgi = { path = "crates/fastcgi" }
enyo-cmd-githack = { path = "crates/githack" }
enyo-cmd-gopher = { path = "crates/gopher" }
enyo-cmd-hash = { path = "crates/hash" }
enyo-cmd-hashpow = { path = "crates/hashpow" }
enyo-cmd-image = { path = "crates/image" }
enyo-cmd-jwttool = { path = "crates/jwttool" }
enyo-cmd-llmapi = { path = "crates/llmapi" }
enyo-cmd-parser = { path = "crates/parser" }
enyo-cmd-qrcode = { path = "crates/qrcode" }
enyo-cmd-sitemap = { path = "crates/sitemap" }
enyo-cmd-terminal = { path = "crates/terminal" }
enyo-cmd-timestamp = { path = "crates/timestamp" }
enyo-cmd-transform = { path = "crates/transform" }
enyo-cmd-wechat = { path = "crates/wechat" }

futures = "0.3.32"
clap = { version = "4.6.0", features = ["env", "string", "unicode", "derive", "cargo"] }
clap_complete = "4.6.0"
anyhow = "1.0.95"
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = "0.1.17"
serde = { version = "1.0.217", features = ["derive", "serde_derive"] }
serde_derive = "1.0.217"
serde_json = "1.0.135"
colored_json = "5.0.0"
comfy-table = "7.1.3"
log = "0.4.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
aes = "0.8.4"
base-x = "0.2.11"
base32 = "0.5.1"
base62 = "2.2.1"
base64 = "0.22.1"
base91 = "0.1.0"
bcrypt = "0.19"
bs58 = "0.5.0"
cbc = "0.1.2"
cc = "1.2.10"
chrono = "0.4.39"
csv = "1.3.1"
ctr = "0.9"
hash = "0.3.0"
hex = "0.4.3"
hmac = "0.12.1"
image = { version = "0.25", features = ["ico", "webp"] }
kamadak-exif = "0.6.1"
ico = "0.5"
indicatif = { version = "0.18.3", features = ["rayon"] }
lazy_static = "1.5.0"
libsqlite3-sys = { version = "0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
md-5 = "0.10"
md4 = "0.10"
num-bigint = "0.4"
pbkdf2 = { version = "0.12.2", features = ["sha1", "sha2"] }
qrcode = "0.14"
rand = "0.10.0"
rayon = "1.10"
regex = "1.10.5"
reqwest = { version = "0.13.1", features = ["json", "stream"] }
ripemd = "0.1"
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl", "sqlcipher"] }
sha1 = "0.10.6"
sha2 = "0.10.8"
sha3 = "0.10"
sitemap = "0.4.1"
url = "2.5.2"
urlencoding = "2.1"
rmcp = { version = "1.2.0", features = ["server", "macros", "auth"] }
async-trait = "0.1.89"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
dirs = "6.0.0"
futures-util = "0.3"
serde_yaml = "0.9.34"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
env_logger = "0.11.8"
tempfile = "3.15"
tower = "0.5"

[dependencies]
enyo-core.workspace = true
enyo-cmd-agentx.workspace = true
enyo-cmd-basex.workspace = true
enyo-cmd-basic.workspace = true
enyo-cmd-encrypt.workspace = true
enyo-cmd-fastcgi.workspace = true
enyo-cmd-githack.workspace = true
enyo-cmd-gopher.workspace = true
enyo-cmd-hash.workspace = true
enyo-cmd-hashpow.workspace = true
enyo-cmd-image.workspace = true
enyo-cmd-jwttool.workspace = true
enyo-cmd-llmapi.workspace = true
enyo-cmd-parser.workspace = true
enyo-cmd-qrcode.workspace = true
enyo-cmd-sitemap.workspace = true
enyo-cmd-terminal.workspace = true
enyo-cmd-timestamp.workspace = true
enyo-cmd-transform.workspace = true
enyo-cmd-wechat.workspace = true

anyhow.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
