[package]
authors = ["Mozhu <mozhu233@outlook.com>"]
description = "The Cyber Swiss Army Knife for terminal"
name = "enyo"
version = "0.1.0"
edition = "2021"
default-run = "enyo"

# Main binary (src/bin/*.rs are auto-discovered by Cargo)
[[bin]]
name = "enyo"
path = "src/main.rs"

# GitHub CLI extension for commit message formatting
[[bin]]
name = "gh-mozhu"
path = "src/bin/gh_mozhu.rs"

[dependencies]
# 核心
futures = "0.3.31"
clap = { version = "4.5.24", features = ["env", "string", "unicode", "derive"] }
clap_complete = "4.5.47"
anyhow = "1.0.95"
tokio = { version = "1.43.0", features = ["full"] }
tokio-stream = "0.1.17"
# 序列化相关依赖
serde = { version = "1.0.217", features = ["derive", "serde_derive"] }
serde_derive = "1.0.217"
serde_json = "1.0.135"
# 输出相关依赖
colored_json = "5.0.0"
comfy-table = "7.1.3"
# 日志相关依赖
log = "0.4.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# 命令依赖
aes = "0.8.4"
base-x = "0.2.11"
base32 = "0.5.1"
base62 = "2.2.1"
base64 = "0.22.1"
base91 = "0.1.0"
bcrypt = "0.17"
bs58 = "0.5.0"
cbc = "0.1.2"
cc = "1.2.10"
chrono = "0.4.39"
csv = "1.3.1"
ctr = "0.9"
hash = "0.3.0"
hex = "0.4.3"
hmac = "0.12.1"
image = { version = "0.25", features = ["ico", "webp"] }
kamadak-exif = "0.5"
ico = "0.4"
indicatif = { version = "0.18.3", features = ["rayon"] }
lazy_static = "1.5.0"
libsqlite3-sys = { version = "0.36.0", features = [
    "bundled-sqlcipher-vendored-openssl",
] }
md-5 = "0.10"
md4 = "0.10"
num-bigint = "0.4"
pbkdf2 = { version = "0.12.2", features = ["sha1", "sha2"] }
qrcode = "0.14"
rand = "0.9.0"
rayon = "1.10"
regex = "1.10.5"
reqwest = { version = "0.13.1", features = ["json"] }
ripemd = "0.1"
rusqlite = { version = "0.38.0", features = [
    "bundled-sqlcipher-vendored-openssl",
    "sqlcipher",
] }
sha1 = "0.10.6"
sha2 = "0.10.8"
sha3 = "0.10"
sitemap = "0.4.1"
url = "2.5.2"
urlencoding = "2.1"
rmcp = { version = "0.12.0", features = ["server", "macros", "auth"] }

[build-dependencies]
clap_complete = "4.5.47"

[dev-dependencies]
env_logger = "0.11.8"
tempfile = "3.15"